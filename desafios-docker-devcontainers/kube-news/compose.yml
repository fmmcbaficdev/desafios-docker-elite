# Docker Compose de produção.
# Sobe só com este arquivo — o override do DevContainer NÃO é aplicado.
#
#   docker compose -f compose.yml up -d --build
#   http://localhost:8088
#
# A 8080 do host costuma estar com rota42-institucional. APP_PORT sobrescreve.

name: kube-news-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: kubedevnews
      DB_USERNAME: kubedevnews
      DB_PASSWORD: Pg#123
      DB_SSL_REQUIRE: "false"
    ports:
      - "${APP_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kubedevnews
      POSTGRES_PASSWORD: Pg#123
      POSTGRES_DB: kubedevnews
    volumes:
      - kube-news-postgres-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubedevnews -d kubedevnews"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kube-news-postgres-prod:
    name: kube-news-prod-postgres
    driver: local
