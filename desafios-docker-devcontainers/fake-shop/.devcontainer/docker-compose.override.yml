# Ajustes para desenvolvimento dentro do DevContainer.
# Caminhos relativos ao primeiro compose (compose.yml na raiz do fake-shop).

name: fake-shop-devcontainer

services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.dev
    image: fake-shop-devcontainer
    command: sleep infinity
    working_dir: /workspaces/fake-shop
    environment:
      FLASK_ENV: development
      APP_ENV: development
      FLASK_DEBUG: "1"
      FLASK_APP: index.py
      PROMETHEUS_MULTIPROC_DIR: /tmp/metrics
    ports: !reset []
    volumes:
      - .:/workspaces/fake-shop:cached
    user: vscode

  db:
    volumes: !override
      - fake-shop-postgres-dev:/var/lib/postgresql/data

volumes:
  fake-shop-postgres-dev:
    name: fake-shop-dev-postgres
    driver: local
